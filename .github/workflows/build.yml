name: Desktop release candidates

on:
  push:
  pull_request:
  workflow_dispatch:

# This workflow creates tested candidate artifacts only. It never publishes a
# GitHub Release, uploads to a store, or claims signing/notarization credentials.
permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  build:
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # Candidate branches fill the Windows validation gap without repeating
      # locally verified Mac/Linux builds. Normal CI and manual runs test all.
      matrix:
        include: >-
          ${{ fromJSON(
            (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/codex/release-candidate-'))
            && '[{"os":"windows-2022","host":"windows","arch":"win64_msvc2022_64","qt_dir":"msvc2022_64","target":"windows-x86_64","filament":"OFF"}]'
            || '[{"os":"macos-15","host":"mac","arch":"clang_64","qt_dir":"macos","target":"macos-arm64","filament":"ON","apple_arch":"arm64"},{"os":"macos-15-intel","host":"mac","arch":"clang_64","qt_dir":"macos","target":"macos-x86_64","filament":"OFF","apple_arch":"x86_64"},{"os":"windows-2022","host":"windows","arch":"win64_msvc2022_64","qt_dir":"msvc2022_64","target":"windows-x86_64","filament":"OFF"},{"os":"ubuntu-24.04","host":"linux","arch":"linux_gcc_64","qt_dir":"gcc_64","target":"linux-x86_64","filament":"OFF"}]'
          ) }}
    runs-on: ${{ matrix.os }}
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      QT_QPA_OFFSCREEN_NO_GLX: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux desktop and packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build zlib1g-dev patchelf binutils xvfb xauth fonts-dejavu-core \
            libgl1-mesa-dev libegl1-mesa-dev libgl1-mesa-dri libfontconfig1 libfreetype6 \
            libx11-xcb1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libxcb-xinput0 \
            libxkbcommon-x11-0 libdbus-1-3 libasound2t64 libpulse0 libnss3 libglib2.0-0t64 \
            libxcomposite1 libxrandr2 libxdamage1 libxss1 libxtst6
      - name: Install pinned Qt SDK and Multimedia runtime dependencies
        run: |
          python -m pip install aqtinstall==3.3.0
          python -m aqt install-qt ${{ matrix.host }} desktop 6.10.3 ${{ matrix.arch }} --outputdir .deps/Qt --modules qtmultimedia --archives qtbase qtsvg qtmultimedia ${{ runner.os == 'Linux' && 'qtdeclarative icu' || '' }}
      - name: Install pinned Apple Silicon 3D renderer
        if: matrix.filament == 'ON'
        run: ./scripts/setup_filament.sh
      - name: Install static zlib with the MSVC shared runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .deps/triplets | Out-Null
          @'
          set(VCPKG_TARGET_ARCHITECTURE x64)
          set(VCPKG_CRT_LINKAGE dynamic)
          set(VCPKG_LIBRARY_LINKAGE static)
          '@ | Set-Content .deps/triplets/toon-x64-windows.cmake
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install zlib:toon-x64-windows --overlay-triplets="${{ github.workspace }}/.deps/triplets"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure macOS release candidate
        if: runner.os == 'macOS'
        run: >-
          cmake -S . -B build
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}/.deps/Qt/6.10.3/${{ matrix.qt_dir }}"
          -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0
          -DCMAKE_OSX_ARCHITECTURES=${{ matrix.apple_arch }}
          -DTOON_ENABLE_FILAMENT=${{ matrix.filament }} -DBUILD_TESTING=ON
      - name: Configure Linux release candidate
        if: runner.os == 'Linux'
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}/.deps/Qt/6.10.3/${{ matrix.qt_dir }}"
          -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_LIBDIR=lib
          -DTOON_ENABLE_FILAMENT=OFF -DBUILD_TESTING=ON
      - name: Configure Windows release candidate
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 "-DCMAKE_PREFIX_PATH=${{ github.workspace }}/.deps/Qt/6.10.3/${{ matrix.qt_dir }}" "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" "-DVCPKG_OVERLAY_TRIPLETS=${{ github.workspace }}/.deps/triplets" -DVCPKG_TARGET_TRIPLET=toon-x64-windows -DTOON_ENABLE_FILAMENT=OFF -DBUILD_TESTING=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build with bounded parallelism
        run: cmake --build build --config Release --parallel 4
      - name: Test on macOS
        if: runner.os == 'macOS'
        run: ctest --test-dir build -C Release --output-on-failure --parallel 2
      - name: Test on Linux with a virtual display
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1600x1200x24" ctest --test-dir build -C Release --output-on-failure --parallel 2
      - name: Test on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "${{ github.workspace }}\.deps\Qt\6.10.3\msvc2022_64\bin;$env:PATH"
          ctest --test-dir build -C Release --output-on-failure --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check packaging scripts
        run: python -m unittest discover -s tests -p test_packaging_scripts.py
      # Packages are produced only after tests, through a deliberate manual
      # run or an explicitly named release-candidate branch. No signing keys
      # or GitHub Release publication are used; artifacts share repo visibility.
      - name: Stage, relocate and verify macOS candidate
        if: success() && github.event_name == 'workflow_dispatch' && runner.os == 'macOS'
        shell: bash
        run: |
          args=(--dmg)
          if [ "${{ matrix.filament }}" = ON ]; then args+=(--require-3d); fi
          python scripts/package_desktop.py --build-dir build --config Release --qt-root ".deps/Qt/6.10.3/${{ matrix.qt_dir }}" --output-dir build/package --skip-build "${args[@]}"
      - name: Stage, relocate and verify Linux candidate
        if: success() && github.event_name == 'workflow_dispatch' && runner.os == 'Linux'
        run: >-
          xvfb-run -a -s "-screen 0 1600x1200x24"
          python scripts/package_desktop.py --build-dir build --config Release
          --qt-root ".deps/Qt/6.10.3/${{ matrix.qt_dir }}" --output-dir build/package --skip-build
      - name: Stage, relocate and verify Windows candidate
        if: success() && runner.os == 'Windows' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/codex/release-candidate-')))
        shell: pwsh
        run: |
          $env:PATH = "${{ github.workspace }}\.deps\Qt\6.10.3\msvc2022_64\bin;$env:PATH"
          python scripts/package_desktop.py --build-dir build --config Release --qt-root ".deps/Qt/6.10.3/${{ matrix.qt_dir }}" --output-dir build/package --skip-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload verified candidate packages
        if: success() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/codex/release-candidate-')))
        uses: actions/upload-artifact@v4
        with:
          name: ToonPro-candidate-${{ matrix.target }}
          path: |
            build/package/*.zip
            build/package/*.tar.gz
            build/package/*.dmg
            build/package/SHA256SUMS
            build/package/package.json
            build/package/verification/**
          if-no-files-found: error
          retention-days: 30
      - name: Upload diagnostic logs even when verification fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ToonPro-diagnostics-${{ matrix.target }}
          path: |
            build/build-capabilities-*.json
            build/Testing/Temporary/**
            build/package/verification/**
            build/test-artifacts/*.png
          if-no-files-found: warn
          retention-days: 14
