name: Desktop release candidates

on:
  push:
    branches-ignore: ['codex/media-probe-*']
    paths:
      - 'src/**'
      - 'include/**'
      - 'resources/**'
      - 'tests/**'
      - 'scripts/**'
      - 'cmake/**'
      - 'third-party/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - '*.cmake'
      - 'vcpkg*.json'
      - '.github/workflows/build.yml'
      - 'docs/DEPENDENCY-REBUILDING.txt'
  pull_request:
    paths:
      - 'src/**'
      - 'include/**'
      - 'resources/**'
      - 'tests/**'
      - 'scripts/**'
      - 'cmake/**'
      - 'third-party/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - '*.cmake'
      - 'vcpkg*.json'
      - '.github/workflows/build.yml'
      - 'docs/DEPENDENCY-REBUILDING.txt'
  workflow_dispatch:

# Main builds may publish an explicitly unsigned/ad-hoc preview after all
# per-platform test, runtime, source-bundle and upload-integrity gates pass.
permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  build:
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # Candidate branches fill the Windows validation gap without repeating
      # locally verified Mac builds. Normal CI and manual runs test Mac/Windows.
      # Linux recipes remain in the repository but its release is deferred.
      matrix:
        include: >-
          ${{ fromJSON(
            (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/codex/release-candidate-'))
            && '[{"os":"windows-2022","host":"windows","arch":"win64_msvc2022_64","qt_dir":"msvc2022_64","target":"windows-x86_64","filament":"OFF"}]'
            || '[{"os":"macos-15","host":"mac","arch":"clang_64","qt_dir":"macos","target":"macos-arm64","filament":"ON","apple_arch":"arm64"},{"os":"macos-15-intel","host":"mac","arch":"clang_64","qt_dir":"macos","target":"macos-x86_64","filament":"OFF","apple_arch":"x86_64"},{"os":"windows-2022","host":"windows","arch":"win64_msvc2022_64","qt_dir":"msvc2022_64","target":"windows-x86_64","filament":"OFF"}]'
          ) }}
    runs-on: ${{ matrix.os }}
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      QT_QPA_OFFSCREEN_NO_GLX: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore pinned Qt SDK
        id: qt-sdk
        uses: actions/cache/restore@v4
        with:
          path: .deps/Qt
          key: qt-6.10.3-${{ matrix.target }}-base-svg-multimedia-runtime-v2
      - name: Install Linux desktop and packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build zlib1g-dev pkg-config nasm libssl-dev libva-dev libvdpau-dev \
            libva2 libva-drm2 libva-x11-2 libvdpau1 patchelf binutils xvfb xauth fonts-dejavu-core \
            libgl1-mesa-dev libegl1-mesa-dev libgl1-mesa-dri libfontconfig1 libfreetype6 \
            libx11-xcb1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libxcb-xinput0 \
            libxkbcommon-x11-0 libdbus-1-3 libasound2t64 libpulse0 libnss3 libglib2.0-0t64 \
            libxcomposite1 libxrandr2 libxdamage1 libxss1 libxtst6 \
            libgtk-3-0t64 libwayland-cursor0 libwayland-egl1 libxcb-shape0
      - name: Install pinned Qt SDK and Multimedia runtime dependencies
        if: steps.qt-sdk.outputs.cache-hit != 'true'
        run: |
          python -m pip install aqtinstall==3.3.0
          python -m aqt install-qt ${{ matrix.host }} desktop 6.10.3 ${{ matrix.arch }} --outputdir .deps/Qt --modules qtmultimedia --archives qtbase qtsvg qtmultimedia ${{ runner.os == 'Linux' && 'qtdeclarative icu' || '' }}
      - name: Save verified Qt SDK before application checks
        if: steps.qt-sdk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .deps/Qt
          key: qt-6.10.3-${{ matrix.target }}-base-svg-multimedia-runtime-v2
      - name: Install pinned Apple Silicon 3D renderer
        if: matrix.filament == 'ON'
        run: ./scripts/setup_filament.sh
      - name: Install static zlib with the MSVC shared runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .deps/triplets | Out-Null
          @'
          set(VCPKG_TARGET_ARCHITECTURE x64)
          set(VCPKG_CRT_LINKAGE dynamic)
          set(VCPKG_LIBRARY_LINKAGE static)
          '@ | Set-Content .deps/triplets/toon-x64-windows.cmake
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install zlib:toon-x64-windows --overlay-triplets="${{ github.workspace }}/.deps/triplets"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure macOS release candidate
        if: runner.os == 'macOS'
        run: >-
          cmake -S . -B build
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}/.deps/Qt/6.10.3/${{ matrix.qt_dir }}"
          -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0
          -DCMAKE_OSX_ARCHITECTURES=${{ matrix.apple_arch }}
          "-DCMAKE_CXX_FLAGS_RELEASE=-O3 -DNDEBUG -gline-tables-only"
          -DTOON_ENABLE_FILAMENT=${{ matrix.filament }} -DBUILD_TESTING=ON
      - name: Configure Linux release candidate
        if: runner.os == 'Linux'
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}/.deps/Qt/6.10.3/${{ matrix.qt_dir }}"
          -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_LIBDIR=lib
          -DTOON_ENABLE_FILAMENT=OFF -DBUILD_TESTING=ON
      - name: Configure Windows release candidate
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 "-DCMAKE_PREFIX_PATH=${{ github.workspace }}/.deps/Qt/6.10.3/${{ matrix.qt_dir }}" "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" "-DVCPKG_OVERLAY_TRIPLETS=${{ github.workspace }}/.deps/triplets" -DVCPKG_TARGET_TRIPLET=toon-x64-windows -DTOON_ENABLE_FILAMENT=OFF -DBUILD_TESTING=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows diagnostic targets
        if: runner.os == 'Windows'
        run: >-
          cmake --build build --config Release --parallel 4 --target
          toon_drawing_template_library_tests toon_property_row_tests
          toon_project_save_tests toon_cel_workflows_tests
          toon_audio_export_tests toon_video_export_tests toon_vector_brush_storage_tests
      - name: Build with bounded parallelism
        id: native-build
        if: runner.os != 'Windows'
        run: cmake --build build --config Release --parallel 4
      - name: Build pinned Linux software video runtime
        if: success() && github.event_name == 'workflow_dispatch' && runner.os == 'Linux'
        env:
          TOON_CODEC_JOBS: 2
        run: bash scripts/build_linux_codecs.sh build/linux-codecs
      - name: Test on macOS
        id: mac-tests
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set +e
          ctest --test-dir build -C Release --output-on-failure --parallel 2 --output-junit "${{ github.workspace }}/build/full-tests.xml"
          test_status=$?
          if [ "$test_status" != 0 ] && [ -f build/Testing/Temporary/LastTestsFailed.log ]; then
            cat build/Testing/Temporary/LastTestsFailed.log >> build/mac-native-failures.log
          fi
          exit "$test_status"
      - name: Require three stable recolor workspace runs on Mac
        if: always() && runner.os == 'macOS' && steps.native-build.outcome == 'success'
        shell: bash
        run: |
          set +e
          ctest --test-dir build -C Release --output-on-failure -R '^character_recolor_workspace$' --repeat until-fail:3 --output-junit "${{ github.workspace }}/build/recolor-repeat.xml"
          test_status=$?
          if [ "$test_status" != 0 ] && [ -f build/Testing/Temporary/LastTestsFailed.log ]; then
            cat build/Testing/Temporary/LastTestsFailed.log >> build/mac-native-failures.log
          fi
          exit "$test_status"
      - name: Capture optimized recolor crash diagnostics when it fails
        if: failure() && runner.os == 'macOS' && steps.native-build.outcome == 'success'
        run: >-
          python scripts/diagnose_recolor_crash.py --build-dir build
          --failure-log build/mac-native-failures.log
          --report-dir build/test-artifacts/recolor-diagnostics
      - name: Test on Linux with a virtual display
        if: runner.os == 'Linux'
        run: |
          if [ -d "$PWD/build/linux-codecs/install/lib" ]; then
            export LD_LIBRARY_PATH="$PWD/build/linux-codecs/install/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          fi
          xvfb-run -a -s "-screen 0 1600x1200x24" ctest --test-dir build -C Release --output-on-failure --parallel 2
      - name: Diagnose Windows save and workspace flows
        id: windows-diagnostics
        if: runner.os == 'Windows'
        # Continue collecting the full suite's evidence after a diagnostic
        # failure. The explicit gate below still makes the job fail and
        # prevents packaging; no failed check is ignored for distribution.
        continue-on-error: true
        shell: pwsh
        run: |
          $env:PATH = "${{ github.workspace }}\.deps\Qt\6.10.3\msvc2022_64\bin;$env:PATH"
          $env:QT_FORCE_STDERR_LOGGING = '1'
          $diagnosticFailed = $false
          foreach ($suite in @('drawing_template_library', 'property_row', 'project_save', 'cel_workflows', 'audio_export', 'video_export', 'vector_brush_storage')) {
            ctest --test-dir build -C Release --output-on-failure --parallel 1 --stop-on-failure -R ('^' + $suite + '$')
            if ($LASTEXITCODE -ne 0) { $diagnosticFailed = $true }
            if (Test-Path build/Testing/Temporary/LastTest.log) {
              Copy-Item build/Testing/Temporary/LastTest.log "build/Testing/Temporary/diagnostic-$suite.log"
            }
          }
          if ($diagnosticFailed) { exit 1 }
      - name: Build remaining Windows application and test targets
        if: runner.os == 'Windows'
        run: cmake --build build --config Release --parallel 4
      - name: Test on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "${{ github.workspace }}\.deps\Qt\6.10.3\msvc2022_64\bin;$env:PATH"
          $env:QT_FORCE_STDERR_LOGGING = '1'
          ctest --test-dir build -C Release --output-on-failure --parallel 2 --output-junit "${{ github.workspace }}/build/full-tests.xml"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Require successful Windows diagnostics before packaging
        if: always() && runner.os == 'Windows' && steps.windows-diagnostics.outcome == 'failure'
        shell: pwsh
        run: |
          Write-Error 'Windows diagnostics failed. Full-suite results were collected, but this candidate cannot be packaged.'
          exit 1
      - name: Check packaging scripts
        run: python -m unittest discover -s tests -p test_packaging_scripts.py
      - name: Check release publication gates
        run: python -m unittest discover -s tests -p test_release_preview.py
      - name: Check recolor diagnostic collection
        if: runner.os == 'macOS'
        run: python -m unittest discover -s tests -p test_recolor_diagnostics.py
      # Packages are produced only after tests, through a deliberate manual
      # run, main integration, or an explicitly named release-candidate branch.
      # Public preview publication is a separate, main-only job below.
      - name: Stage, relocate and verify macOS candidate
        if: success() && runner.os == 'macOS' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        shell: bash
        run: |
          args=(--dmg)
          if [ "${{ matrix.filament }}" = ON ]; then args+=(--require-3d); fi
          python scripts/package_desktop.py --build-dir build --config Release --qt-root ".deps/Qt/6.10.3/${{ matrix.qt_dir }}" --output-dir build/package --skip-build "${args[@]}"
      - name: Stage, relocate and verify Linux candidate
        if: success() && github.event_name == 'workflow_dispatch' && runner.os == 'Linux'
        run: >-
          python scripts/package_desktop.py --build-dir build --config Release
          --qt-root ".deps/Qt/6.10.3/${{ matrix.qt_dir }}" --output-dir build/package --skip-build --xvfb
          --ffmpeg-root build/linux-codecs/install
      - name: Stage, relocate and verify Windows candidate
        if: success() && runner.os == 'Windows' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/codex/release-candidate-'))))
        shell: pwsh
        run: |
          $env:PATH = "${{ github.workspace }}\.deps\Qt\6.10.3\msvc2022_64\bin;$env:PATH"
          python scripts/package_desktop.py --build-dir build --config Release --qt-root ".deps/Qt/6.10.3/${{ matrix.qt_dir }}" --output-dir build/package --skip-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Collect matching dependency sources
        if: success() && runner.os != 'Linux' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/codex/release-candidate-'))))
        run: >-
          python scripts/collect_dependency_sources.py
          --qt-root ".deps/Qt/6.10.3/${{ matrix.qt_dir }}"
          --output-dir "build/package/dependency-sources/ToonPro-0.75.0-${{ matrix.target }}-dependency-sources"
      - name: Bind verification evidence to this exact native build
        if: success() && runner.os != 'Linux' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/codex/release-candidate-'))))
        shell: bash
        run: |
          ctest --test-dir build -C Release --show-only=json-v1 > build/configured-tests.json
          python scripts/release_preview.py attest --package build/package --target "${{ matrix.target }}" --commit "${{ github.sha }}" --run-id "${{ github.run_id }}" --tests build/full-tests.xml --expected build/configured-tests.json
      - name: Upload verified candidate packages
        if: success() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/codex/release-candidate-'))))
        uses: actions/upload-artifact@v4
        with:
          name: ToonPro-candidate-${{ matrix.target }}
          path: |
            build/package/*.zip
            build/package/*.tar.gz
            build/package/*.dmg
            build/package/SHA256SUMS
            build/package/package.json
            build/package/ci-verification.json
            build/package/full-tests.xml
            build/package/dependency-sources/*.tar.gz
            build/package/dependency-sources/*.sha256
            build/package/verification/**
          if-no-files-found: error
          retention-days: 30
      - name: Upload diagnostic logs even when verification fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ToonPro-diagnostics-${{ matrix.target }}
          path: |
            build/build-capabilities-*.json
            build/Testing/Temporary/**
            build/package/verification/**
            build/test-artifacts/*.png
            build/test-artifacts/recolor-diagnostics/**
            build/mac-native-failures.log
            build/full-tests.xml
            build/recolor-repeat.xml
            build/linux-codecs/logs/**
          if-no-files-found: warn
          retention-days: 14

  publish-preview:
    needs: build
    # Each artifact exists only after its entire native job succeeds. One failed
    # platform cannot be advertised or prevent other verified targets shipping.
    if: always() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: ToonPro-candidate-*
          path: build/candidates
      - name: Read final native job outcomes for this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100" > build/native-jobs.json
      - name: Verify exact-build evidence and prepare preview
        run: >-
          python scripts/release_preview.py prepare --inputs build/candidates
          --output build/public-preview --repository "${{ github.repository }}"
          --commit "${{ github.sha }}" --run-id "${{ github.run_id }}" --jobs build/native-jobs.json
      - name: Upload and verify all assets before making the preview public
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/release_preview.py publish --output build/public-preview
          --repository "${{ github.repository }}" --commit "${{ github.sha }}"
          --run-id "${{ github.run_id }}"
      - name: Record durable download URLs
        run: cat build/public-preview/RELEASE-NOTES.md >> "$GITHUB_STEP_SUMMARY"
