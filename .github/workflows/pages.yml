name: Publish Toon Pro website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  workflow_run:
    workflows: ['Desktop release candidates']
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    # A partial preview may contain passing platforms from a failed matrix.
    # Always build from main and read the public release, never a PR artifact.
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned documentation builder
        run: python -m pip install -r website/requirements.txt
      - name: Resolve verified public Windows and Mac downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m unittest discover -s website -p test_sync_downloads.py
          python website/sync_downloads.py website/releases.json
      - name: Build website and illustrated field guide
        run: python website/build.py --output build/website --base '/${{ github.event.repository.name }}/'
      - name: Check pages, links, screenshots and download status
        run: python website/check_site.py --root build/website --base '/${{ github.event.repository.name }}/'
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/website
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
