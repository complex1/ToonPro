name: Build Toon Pro website (manual)

on:
  workflow_dispatch:

# GitHub Pages serves the locally built gh-pages branch with .nojekyll.
# This optional manual workflow only validates/builds an artifact; it does not
# re-enable repository Actions or publish desktop previews.

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python documentation runtime
        run: python --version
      - name: Build website, manual and feature catalog
        run: python website/build.py --output build/website --base '/${{ github.event.repository.name }}/'
      - name: Check pages, links, screenshots and search coverage
        run: python website/check_site.py --root build/website --base '/${{ github.event.repository.name }}/'
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/website
