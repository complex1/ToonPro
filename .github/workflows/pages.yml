name: Publish Toon Pro website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned documentation builder
        run: python -m pip install -r website/requirements.txt
      - name: Build website and illustrated field guide
        run: python website/build.py --output build/website --base '/${{ github.event.repository.name }}/'
      - name: Check pages, links, screenshots and download status
        run: python website/check_site.py --root build/website --base '/${{ github.event.repository.name }}/'
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/website
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
